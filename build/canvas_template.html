<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PMSoc LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:wght@700;800&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Title wordmark font (Fraunces, weight 600) — embedded directly as a
     data-URI @font-face so the title renders correctly even inside
     sandboxed/offline viewers (e.g. Canvas LMS) without depending on a
     Google Fonts network request. */
  @font-face {
    font-family: 'Fraunces';
    src: url(data:font/woff2;base64,{fraunces_font}) format('woff2');
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  /* ============================================================
     PALETTE (from SOPM x PMSoc BBQ flyer)
     --deep-teal   #04484b  headings, footer link, dates
     --mid-teal    #587e7f  borders, accents
     --pale        #dce5e6  page background
     --light-teal  #b7d0d1  hover states, chips
     ============================================================ */
  :root {
    --deep-teal:  #04484b;
    --mid-teal:   #587e7f;
    --pale:       #dce5e6;
    --light-teal: #b7d0d1;
    --ink:        #1B1F23;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--pale);
    color: var(--ink);
  }
  .feed-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 12px;
  }
  .feed-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 20px;
  }
  .feed-head-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }
  .feed-head-logo {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 10px;
    object-fit: contain;
    border: 1px solid var(--light-teal);
    background: #fff;
  }
  .feed-title {
    flex: 0 1 auto;
    height: 54px;
    width: auto;
    max-width: 100%;
    overflow: visible;
  }
  /* Change this one font-family to swap the title's look —
     e.g. 'Fraunces', 'Anton', 'Archivo Black', 'Bebas Neue' all work well here. */
  .feed-title text {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 600;
  }
  .feed-title .title-shadow { fill: var(--light-teal); }
  .feed-title .title-main { fill: var(--deep-teal); }
  /* Fixed-height scroll box: all posts stack vertically as before, but the
     list scrolls internally within a fixed height instead of expanding
     the whole page — good for Canvas, where you don't want one embed to
     take over the entire course page. Adjust --feed-scroll-height to
     taste (it's a CSS var so it's easy to find/change in one place). */
  :root {
    --feed-scroll-height: 1000px;
  }
  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-height: var(--feed-scroll-height);
    overflow-y: auto;
    padding: 4px 4px 4px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--mid-teal) var(--pale);
  }
  .feed-list::-webkit-scrollbar { width: 8px; }
  .feed-list::-webkit-scrollbar-track { background: var(--pale); }
  .feed-list::-webkit-scrollbar-thumb {
    background: var(--mid-teal);
    border-radius: 999px;
  }
  .feed-item {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    border: 1px solid var(--mid-teal);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 6px rgba(4, 72, 75, 0.08);
  }
  .feed-item-body {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .feed-item-text {
    flex: 1 1 55%;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }
  .feed-item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .feed-item-logo {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    flex: 0 0 auto;
    object-fit: contain;
    border: 1px solid var(--light-teal);
    background: #fff;
    padding: 3px;
  }
  .feed-item-headtext {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-top: 2px;
    min-width: 0;
  }
  .feed-item-date {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mid-teal);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .feed-item-date svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: var(--mid-teal);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: 0 0 auto;
  }
  .feed-item-headtext h3 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--deep-teal);
    margin: 0;
    line-height: 1.3;
  }
  .feed-item-text p {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .feed-item-link {
    align-self: flex-start;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--deep-teal);
    text-decoration: none;
    border-bottom: 1px solid var(--mid-teal);
    padding-bottom: 1px;
  }
  .feed-item-link:hover { color: var(--mid-teal); }
  .feed-item-photo {
    flex: 1 1 45%;
    min-width: 200px;
    background: var(--light-teal);
  }
  .feed-item-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  @media (max-width: 560px) {
    .feed-item-body { flex-direction: column; }
    .feed-item-photo { min-height: 180px; }
  }
  /* LinkedIn-style action bar under each card */
  .feed-item-actions {
    display: flex;
    border-top: 1px solid var(--light-teal);
    background: #fcfdfd;
  }
  .feed-item-actions .action {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mid-teal);
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .feed-item-actions .action:hover {
    background: var(--pale);
    color: var(--deep-teal);
  }
  .feed-item-actions .action:hover svg {
    stroke: var(--deep-teal);
  }
  .feed-item-actions .action svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--mid-teal);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .feed-item-actions .action + .action {
    border-left: 1px solid var(--light-teal);
  }
  .feed-foot {
    text-align: center;
    padding: 18px 0 24px;
  }
  .feed-foot a {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    color: var(--deep-teal);
    background: var(--light-teal);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: background 0.15s ease;
  }
  .feed-foot a:hover { background: var(--mid-teal); color: #fff; }
</style>
</head>
<body>

<div class="feed-wrap">
  <div class="feed-head">
    <!-- Logo + wordmark are both linked to the PMSoc LinkedIn company page.
         Editable wordmark: swap the font-family in .feed-title text above
         to restyle both lines at once. Text stays real text (not outlined
         paths), so it's still selectable/editable here. -->
    <a class="feed-head-top" href="https://www.linkedin.com/company/sydney-university-project-management-society/" target="_blank" rel="noopener" aria-label="Sydney University Project Management Society on LinkedIn">
      <img class="feed-head-logo" src="{li_logo}" alt="LinkedIn logo">
      <svg class="feed-title" viewBox="0 0 620 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sydney University Project Management Society">
        <text class="title-shadow" x="3" y="27" font-size="30" letter-spacing="1">SYDNEY UNIVERSITY</text>
        <text class="title-shadow" x="3" y="55" font-size="22" letter-spacing="1">PROJECT MANAGEMENT SOCIETY</text>
        <text class="title-main" x="0" y="24" font-size="30" letter-spacing="1">SYDNEY UNIVERSITY</text>
        <text class="title-main" x="0" y="52" font-size="22" letter-spacing="1">PROJECT MANAGEMENT SOCIETY</text>
      </svg>
    </a>
  </div>

  <!-- ============================================================
       These cards are static snapshots (text + photo pulled from
       each LinkedIn post), not live embeds, so the photo can sit
       beside the text instead of below it. To add a new post:
       duplicate a <div class="feed-item"> block, swap in the new
       date / title / text / photo / link, and place it at the top.
       ============================================================ -->

  <div class="feed-list">
{{CARDS}}
  </div>

  <div class="feed-foot">
    <a href="https://www.linkedin.com/company/sydney-university-project-management-society/" target="_blank" rel="noopener">See more on PMSOC LinkedIn</a>
  </div>
</div>

<script>
  // Post dates are stored as absolute ISO dates (data-iso) so this page
  // never goes stale — "time ago" text is computed fresh every time the
  // page is opened, rather than being frozen at build time.
  (function () {
    function timeAgo(iso) {
      var then = new Date(iso + 'T00:00:00Z');
      var days = Math.floor((Date.now() - then.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 30) return days + ' days ago';
      if (days < 365) {
        var m = Math.max(1, Math.round(days / 30.44));
        return m + (m === 1 ? ' month ago' : ' months ago');
      }
      var y = Math.max(1, Math.round(days / 365.25));
      return y + (y === 1 ? ' year ago' : ' years ago');
    }
    document.querySelectorAll('.date-text[data-iso]').forEach(function (el) {
      el.textContent = timeAgo(el.getAttribute('data-iso'));
    });
  })();
</script>
</body>
</html>
