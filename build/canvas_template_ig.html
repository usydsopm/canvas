<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PMSoc Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:wght@700;800&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Title wordmark font (Fraunces, weight 600) — embedded directly as a
     data-URI @font-face so the title renders correctly even inside
     sandboxed/offline viewers (e.g. Canvas LMS) without depending on a
     Google Fonts network request. Same embedded font as the LinkedIn
     widget (build/assets/fraunces_b64.txt), reused here for consistency. */
  @font-face {
    font-family: 'Fraunces';
    src: url(data:font/woff2;base64,{fraunces_font}) format('woff2');
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  /* ============================================================
     PALETTE (matches the LinkedIn widget — SOPM x PMSoc BBQ flyer)
     --deep-teal   #04484b  headings, footer link, dates
     --mid-teal    #587e7f  borders, accents
     --pale        #dce5e6  page background
     --light-teal  #b7d0d1  hover states, chips
     ============================================================ */
  :root {
    --deep-teal:  #04484b;
    --mid-teal:   #587e7f;
    --pale:       #dce5e6;
    --light-teal: #b7d0d1;
    --ink:        #1B1F23;
  }
  * { box-sizing: border-box; }
  /* Same fixed-height-iframe trick as the LinkedIn widget: the page fills
     the iframe viewport exactly and .feed-list absorbs the leftover space
     via flex, so any iframe height works with a single internal scrollbar. */
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Poppins', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--pale);
    color: var(--ink);
  }
  .feed-wrap {
    max-width: 860px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 16px 12px;
  }
  .feed-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 20px;
  }
  .feed-head-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }
  .feed-head-logo {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 14px;
    object-fit: contain;
    border: 1px solid var(--light-teal);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .feed-head-logo svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: var(--deep-teal);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .feed-title {
    flex: 0 1 auto;
    height: 54px;
    width: auto;
    max-width: 100%;
    overflow: visible;
  }
  .feed-title text {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 600;
  }
  .feed-title .title-shadow { fill: var(--light-teal); }
  .feed-title .title-main { fill: var(--deep-teal); }
  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 4px 4px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--mid-teal) var(--pale);
  }
  .feed-list::-webkit-scrollbar { width: 8px; }
  .feed-list::-webkit-scrollbar-track { background: var(--pale); }
  .feed-list::-webkit-scrollbar-thumb {
    background: var(--mid-teal);
    border-radius: 999px;
  }
  /* Instagram-style post card: header (avatar+handle), square photo,
     action-icon row, likes/caption block — unlike the LinkedIn card the
     photo is a full-width square ABOVE the text, matching an IG post. */
  .feed-item {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    border: 1px solid var(--mid-teal);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 6px rgba(4, 72, 75, 0.08);
  }
  .feed-item-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
  }
  .feed-item-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--light-teal);
    background: #fff;
    padding: 2px;
    flex: 0 0 auto;
  }
  .feed-item-handle {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--deep-teal);
  }
  .feed-item-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--light-teal);
    overflow: hidden;
    min-height: 0;
  }
  .feed-item-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .reel-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(4, 72, 75, 0.75);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 999px;
  }
  .reel-badge svg {
    width: 12px;
    height: 12px;
    fill: #fff;
    stroke: none;
  }
  .feed-item-actions {
    display: flex;
    align-items: center;
    padding: 10px 14px 4px;
    gap: 14px;
  }
  .feed-item-actions .action {
    display: flex;
    align-items: center;
    color: var(--mid-teal);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .feed-item-actions .action:hover { color: var(--deep-teal); }
  .feed-item-actions .action:hover svg { stroke: var(--deep-teal); }
  .feed-item-actions .action svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: var(--mid-teal);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .feed-item-actions .spacer { flex: 1 1 auto; }
  .feed-item-text {
    padding: 4px 14px 18px;
  }
  .feed-item-date {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--mid-teal);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .feed-item-caption {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 8px;
    color: var(--ink);
    white-space: pre-line;
  }
  .feed-item-caption .handle-inline {
    font-weight: 700;
    color: var(--deep-teal);
    margin-right: 4px;
  }
  .feed-item-link {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--deep-teal);
    text-decoration: none;
    border-bottom: 1px solid var(--mid-teal);
    padding-bottom: 1px;
  }
  .feed-item-link:hover { color: var(--mid-teal); }
  .feed-foot {
    text-align: center;
    padding: 18px 0 24px;
  }
  .feed-foot a {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    color: var(--deep-teal);
    background: var(--light-teal);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: background 0.15s ease;
  }
  .feed-foot a:hover { background: var(--mid-teal); color: #fff; }
</style>
</head>
<body>

<div class="feed-wrap">
  <div class="feed-head">
    <!-- Avatar box uses an inline Feather "instagram" icon (MIT licensed
         line-art glyph, not the Instagram brand wordmark/logo) rather than
         a raster asset — keeps this consistent with the like/comment/send
         icons below and avoids embedding trademarked brand art. -->
    <a class="feed-head-top" href="https://www.instagram.com/pmsoc.usyd/" target="_blank" rel="noopener" aria-label="Sydney University Project Management Society on Instagram">
      <span class="feed-head-logo">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"></line></svg>
      </span>
      <svg class="feed-title" viewBox="0 0 620 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sydney University Project Management Society">
        <text class="title-shadow" x="3" y="27" font-size="30" letter-spacing="1">SYDNEY UNIVERSITY</text>
        <text class="title-shadow" x="3" y="55" font-size="22" letter-spacing="1">PROJECT MANAGEMENT SOCIETY</text>
        <text class="title-main" x="0" y="24" font-size="30" letter-spacing="1">SYDNEY UNIVERSITY</text>
        <text class="title-main" x="0" y="52" font-size="22" letter-spacing="1">PROJECT MANAGEMENT SOCIETY</text>
      </svg>
    </a>
  </div>

  <!-- ============================================================
       These cards are static snapshots (caption + photo pulled from
       each Instagram post), not a live embed, so they render inside
       a Canvas iframe without any Instagram embed/CSP restrictions.
       To add a new post: duplicate a <div class="feed-item"> block
       (or, more simply, re-run build/build_canvas_html_ig.py after
       editing build/ig_posts.json) and place it at the top.
       ============================================================ -->

  <div class="feed-list">
{{CARDS}}
  </div>

  <div class="feed-foot">
    <a href="https://www.instagram.com/pmsoc.usyd/" target="_blank" rel="noopener">See more on PMSOC Instagram</a>
  </div>
</div>

<script>
  // Post dates are stored as absolute ISO dates (data-iso) so this page
  // never goes stale — "time ago" text is computed fresh every time the
  // page is opened, rather than being frozen at build time.
  (function () {
    function timeAgo(iso) {
      var then = new Date(iso + 'T00:00:00Z');
      var days = Math.floor((Date.now() - then.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 30) return days + ' days ago';
      if (days < 365) {
        var m = Math.max(1, Math.round(days / 30.44));
        return m + (m === 1 ? ' month ago' : ' months ago');
      }
      var y = Math.max(1, Math.round(days / 365.25));
      return y + (y === 1 ? ' year ago' : ' years ago');
    }
    document.querySelectorAll('.date-text[data-iso]').forEach(function (el) {
      el.textContent = timeAgo(el.getAttribute('data-iso'));
    });
  })();
</script>
</body>
</html>
