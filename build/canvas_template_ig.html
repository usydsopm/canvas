<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PMSoc Instagram</title>
<style>
  /* ============================================================
     PALETTE — authentic Instagram look (white / black-grey text /
     Instagram blue), matching the real pmsoc.usyd profile page
     rather than the SoPM/PMSoc teal branding used on the LinkedIn
     widget. System font stack matches Instagram's own UI font.
     ============================================================ */
  :root {
    --ig-bg:            #ffffff;
    --ig-page-bg:       #fafafa;
    --ig-border:        #dbdbdb;
    --ig-border-light:  #efefef;
    --ig-text:          #262626;
    --ig-text-secondary:#8e8e8e;
    --ig-blue:          #0095f6;
    --ig-blue-hover:    #1877f2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ig-page-bg);
    color: var(--ig-text);
  }
  .feed-wrap {
    max-width: 700px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--ig-bg);
    border-left: 1px solid var(--ig-border-light);
    border-right: 1px solid var(--ig-border-light);
  }

  /* ---------------- Profile header ---------------- */
  .ig-header {
    flex: 0 0 auto;
    padding: 24px 20px 0;
  }
  .ig-header-top {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 20px;
  }
  .ig-avatar {
    flex: 0 0 auto;
    width: 77px;
    height: 77px;
    border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--ig-border-light);
    background: #fff;
    padding: 3px;
  }
  .ig-header-info {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ig-username-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }
  .ig-username {
    font-size: 16px;
    font-weight: 400;
    color: var(--ig-text);
    text-decoration: none;
  }
  .ig-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    line-height: 18px;
    border: 1px solid transparent;
  }
  .ig-btn-follow {
    background: var(--ig-blue);
    color: #fff;
  }
  .ig-btn-follow:hover { background: var(--ig-blue-hover); }
  .ig-btn-message {
    background: #efefef;
    color: var(--ig-text);
  }
  .ig-btn-message:hover { background: var(--ig-border); }
  .ig-stats-row {
    display: flex;
    gap: 28px;
    font-size: 14px;
    color: var(--ig-text);
  }
  .ig-stats-row b { font-weight: 600; }
  .ig-bio {
    padding-bottom: 20px;
    font-size: 14px;
    line-height: 1.45;
  }
  .ig-bio-name {
    font-weight: 600;
    margin: 0 0 2px;
  }
  .ig-bio-text {
    margin: 0 0 4px;
    white-space: pre-line;
    color: var(--ig-text);
  }
  .ig-bio-text a {
    color: var(--ig-text);
    font-weight: 600;
    text-decoration: none;
  }
  .ig-bio-text a:hover { text-decoration: underline; }
  .ig-bio-link {
    color: #00376b;
    font-weight: 600;
    text-decoration: none;
  }
  .ig-bio-link:hover { text-decoration: underline; }

  /* ---------------- Tabs ---------------- */
  .ig-tabs {
    display: flex;
    justify-content: center;
    gap: 56px;
    border-top: 1px solid var(--ig-border-light);
  }
  .ig-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ig-text-secondary);
    text-decoration: none;
    border-top: 1px solid transparent;
    margin-top: -1px;
  }
  .ig-tab svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }
  .ig-tab.active {
    color: var(--ig-text);
    border-top-color: var(--ig-text);
  }

  /* ---------------- 3-column grid ---------------- */
  .ig-grid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 3px 0 0;
  }
  .ig-grid-item {
    position: relative;
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--ig-border-light);
  }
  .ig-grid-item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .ig-grid-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 16px;
    height: 16px;
    fill: #fff;
    stroke: #fff;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
  }

  .feed-section-label {
    flex: 0 0 auto;
    padding: 18px 20px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ig-text-secondary);
    border-top: 1px solid var(--ig-border-light);
  }

  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 16px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--ig-border) var(--ig-bg);
  }
  .feed-list::-webkit-scrollbar { width: 8px; }
  .feed-list::-webkit-scrollbar-track { background: var(--ig-bg); }
  .feed-list::-webkit-scrollbar-thumb {
    background: var(--ig-border);
    border-radius: 999px;
  }
  /* Instagram-style post card: header (avatar+handle), square photo,
     action-icon row, likes/caption block. */
  .feed-item {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    border: 1px solid var(--ig-border-light);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .feed-item-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
  }
  .feed-item-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--ig-border-light);
    background: #fff;
    padding: 2px;
    flex: 0 0 auto;
  }
  .feed-item-handle {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ig-text);
  }
  .feed-item-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--ig-border-light);
    overflow: hidden;
    min-height: 0;
  }
  .feed-item-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .reel-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 999px;
  }
  .reel-badge svg {
    width: 12px;
    height: 12px;
    fill: #fff;
    stroke: none;
  }
  .feed-item-actions {
    display: flex;
    align-items: center;
    padding: 10px 14px 4px;
    gap: 16px;
  }
  .feed-item-actions .action {
    display: flex;
    align-items: center;
    color: var(--ig-text);
    text-decoration: none;
    cursor: pointer;
  }
  .feed-item-actions .action svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: var(--ig-text);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .feed-item-actions .spacer { flex: 1 1 auto; }
  .feed-item-text {
    padding: 4px 14px 18px;
  }
  .feed-item-date {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 400;
    color: var(--ig-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .feed-item-caption {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 8px;
    color: var(--ig-text);
    white-space: pre-line;
  }
  .feed-item-caption .handle-inline {
    font-weight: 600;
    color: var(--ig-text);
    margin-right: 4px;
  }
  .feed-item-link {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ig-blue);
    text-decoration: none;
  }
  .feed-item-link:hover { color: var(--ig-blue-hover); }
  .feed-foot {
    flex: 0 0 auto;
    text-align: center;
    padding: 16px 0 20px;
  }
  .feed-foot a {
    display: inline-block;
    color: #fff;
    background: var(--ig-blue);
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    font-weight: 600;
  }
  .feed-foot a:hover { background: var(--ig-blue-hover); }
</style>
</head>
<body>

<div class="feed-wrap">

  <div class="ig-header">
    <div class="ig-header-top">
      <img class="ig-avatar" src="{logo}" alt="pmsoc.usyd avatar">
      <div class="ig-header-info">
        <div class="ig-username-row">
          <a class="ig-username" href="{profile_url}" target="_blank" rel="noopener">{handle}</a>
          <a class="ig-btn ig-btn-follow" href="{profile_url}" target="_blank" rel="noopener">Follow</a>
          <a class="ig-btn ig-btn-message" href="{profile_url}" target="_blank" rel="noopener">Message</a>
        </div>
        <div class="ig-stats-row">
          <span><b>{posts_count}</b> posts</span>
          <span><b>{followers_count}</b> followers</span>
          <span><b>{following_count}</b> following</span>
        </div>
      </div>
    </div>
    <div class="ig-bio">
      <p class="ig-bio-name">{display_name}</p>
      <p class="ig-bio-text">{bio_html}</p>
      <a class="ig-bio-link" href="{link_url}" target="_blank" rel="noopener">{link_text}</a>
    </div>
  </div>

  <div class="ig-tabs">
    <a class="ig-tab active" href="{profile_url}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
      Posts
    </a>
    <a class="ig-tab" href="{reels_url}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      Reels
    </a>
    <a class="ig-tab" href="{tagged_url}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Tagged
    </a>
  </div>

  <!-- ============================================================
       3-column grid — a snapshot of the same posts shown in full
       below, styled like the real profile grid (square tiles, a
       small reel/carousel badge in the corner). Re-run
       build/build_canvas_html_ig.py after editing build/ig_posts.json
       to regenerate both the grid and the caption cards.
       ============================================================ -->
  <div class="ig-grid">
{{GRID}}
  </div>

  <div class="feed-section-label">Recent posts &amp; captions</div>

  <!-- ============================================================
       These cards are static snapshots (caption + photo pulled from
       each Instagram post), not a live embed, so they render inside
       a Canvas iframe without any Instagram embed/CSP restrictions.
       To add a new post: re-run build/build_canvas_html_ig.py after
       editing build/ig_posts.json.
       ============================================================ -->
  <div class="feed-list">
{{CARDS}}
  </div>

  <div class="feed-foot">
    <a href="{profile_url}" target="_blank" rel="noopener">See more on Instagram</a>
  </div>
</div>

<script>
  // Post dates are stored as absolute ISO dates (data-iso) so this page
  // never goes stale — "time ago" text is computed fresh every time the
  // page is opened, rather than being frozen at build time.
  (function () {
    function timeAgo(iso) {
      var then = new Date(iso + 'T00:00:00Z');
      var days = Math.floor((Date.now() - then.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 30) return days + ' days ago';
      if (days < 365) {
        var m = Math.max(1, Math.round(days / 30.44));
        return m + (m === 1 ? ' month ago' : ' months ago');
      }
      var y = Math.max(1, Math.round(days / 365.25));
      return y + (y === 1 ? ' year ago' : ' years ago');
    }
    document.querySelectorAll('.date-text[data-iso]').forEach(function (el) {
      el.textContent = timeAgo(el.getAttribute('data-iso'));
    });
  })();
</script>
</body>
</html>
