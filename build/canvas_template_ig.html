<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PMSoc Instagram</title>
<style>
  /* ============================================================
     PALETTE — authentic Instagram look (white / black-grey text /
     Instagram blue), matching the real pmsoc.usyd profile page
     rather than the SoPM/PMSoc teal branding used on the LinkedIn
     widget. System font stack matches Instagram's own UI font.
     ============================================================ */
  :root {
    --ig-bg:            #ffffff;
    --ig-page-bg:       #fafafa;
    --ig-border:        #dbdbdb;
    --ig-border-light:  #efefef;
    --ig-text:          #262626;
    --ig-text-secondary:#8e8e8e;
    --ig-blue:          #0095f6;
    --ig-blue-hover:    #1877f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ig-page-bg);
    color: var(--ig-text);
  }
  .feed-wrap {
    max-width: 1160px;
    margin: 0 auto;
    background: var(--ig-bg);
    border-left: 1px solid var(--ig-border-light);
    border-right: 1px solid var(--ig-border-light);
  }

  /* ---------------- Profile header ---------------- */
  .ig-header {
    padding: 24px 20px 0;
  }
  .ig-header-top {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 20px;
  }
  .ig-avatar {
    flex: 0 0 auto;
    width: 77px;
    height: 77px;
    border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--ig-border-light);
    background: #fff;
    padding: 3px;
  }
  .ig-header-info {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ig-username-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }
  .ig-username {
    font-size: 16px;
    font-weight: 400;
    color: var(--ig-text);
    text-decoration: none;
  }
  .ig-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    line-height: 18px;
    border: 1px solid transparent;
  }
  .ig-btn-follow {
    background: var(--ig-blue);
    color: #fff;
  }
  .ig-btn-follow:hover { background: var(--ig-blue-hover); }
  .ig-btn-message {
    background: #efefef;
    color: var(--ig-text);
  }
  .ig-btn-message:hover { background: var(--ig-border); }
  .ig-stats-row {
    display: flex;
    gap: 28px;
    font-size: 14px;
    color: var(--ig-text);
  }
  .ig-stats-row b { font-weight: 600; }
  .ig-bio {
    padding-bottom: 20px;
    font-size: 14px;
    line-height: 1.45;
  }
  .ig-bio-name {
    font-weight: 600;
    margin: 0 0 2px;
  }
  .ig-bio-text {
    margin: 0 0 4px;
    white-space: pre-line;
    color: var(--ig-text);
  }
  .ig-bio-text a {
    color: var(--ig-text);
    font-weight: 600;
    text-decoration: none;
  }
  .ig-bio-text a:hover { text-decoration: underline; }
  .ig-bio-link {
    color: #00376b;
    font-weight: 600;
    text-decoration: none;
  }
  .ig-bio-link:hover { text-decoration: underline; }

  /* ---------------- Tabs (centered to the grid/feed column only) ---------------- */
  .ig-tabs {
    display: flex;
    justify-content: center;
    gap: 56px;
    border-top: 1px solid var(--ig-border-light);
    margin-bottom: 6px;
  }
  .ig-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ig-text-secondary);
    text-decoration: none;
    border-top: 1px solid transparent;
    margin-top: -1px;
  }
  .ig-tab svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }
  .ig-tab.active {
    color: var(--ig-text);
    border-top-color: var(--ig-text);
  }

  /* ---------------- Two-column body: grid (left) + detail (right) ---------------- */
  .ig-body {
    display: flex;
    align-items: stretch;
    gap: 20px;
    padding: 3px 20px 8px;
  }
  .ig-grid-col {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ig-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .ig-grid-item {
    position: relative;
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--ig-border-light);
    border: 2px solid transparent;
    cursor: pointer;
  }
  .ig-grid-item.active {
    border-color: var(--ig-blue);
  }
  .ig-grid-item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .ig-grid-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 16px;
    height: 16px;
    fill: #fff;
    stroke: #fff;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    pointer-events: none;
  }
  .ig-grid-pin {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 14px;
    height: 14px;
    fill: #fff;
    stroke: #fff;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    pointer-events: none;
  }

  /* ---------------- Detail panel (right column) ----------------
     A full-height vertical rule (border-left, stretched via
     align-items: stretch on .ig-body above) separates the feed/grid
     side from the highlighted post, rather than boxing the detail
     panel in its own bordered card. */
  .ig-detail-col {
    flex: 0 0 440px;
    border-left: 1px solid var(--ig-border);
    padding-left: 24px;
  }
  .ig-detail {
    position: sticky;
    top: 12px;
    display: flex;
    flex-direction: column;
  }
  .ig-detail-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
  }
  .ig-detail-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--ig-border-light);
    background: #fff;
    padding: 1px;
    flex: 0 0 auto;
  }
  .ig-detail-handle {
    font-size: 13px;
    font-weight: 600;
    color: var(--ig-text);
  }
  .ig-detail-photo-wrap {
    width: 100%;
    max-height: 460px;
    background: var(--ig-page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
  }
  .ig-detail-photo-wrap img {
    display: block;
    width: 100%;
    max-height: 460px;
    object-fit: contain;
  }
  .ig-detail-photo-wrap video {
    display: block;
    width: 100%;
    max-height: 460px;
    object-fit: contain;
    background: #000;
  }
  .ig-detail-actions {
    display: flex;
    align-items: center;
    padding: 10px 12px 2px;
    gap: 14px;
  }
  .ig-detail-actions .action {
    display: flex;
    align-items: center;
    color: var(--ig-text);
    text-decoration: none;
    cursor: pointer;
  }
  .ig-detail-actions .action svg {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: var(--ig-text);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ig-detail-actions .spacer { flex: 1 1 auto; }
  .ig-detail-date {
    padding: 6px 12px 0;
    font-size: 11px;
    color: var(--ig-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ig-detail-caption-wrap {
    padding: 6px 12px 10px;
    overflow-y: auto;
    max-height: 220px;
    flex: 1 1 auto;
  }
  .ig-detail-caption {
    font-size: 13px;
    line-height: 1.5;
    margin: 0;
    color: var(--ig-text);
    white-space: pre-line;
  }
  .ig-detail-caption .handle-inline {
    font-weight: 600;
    color: var(--ig-text);
    margin-right: 4px;
  }
  .ig-detail-link {
    display: block;
    text-align: center;
    padding: 10px 12px;
    border-top: 1px solid var(--ig-border-light);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ig-blue);
    text-decoration: none;
  }
  .ig-detail-link:hover { color: var(--ig-blue-hover); }

  @media (max-width: 760px) {
    .ig-body { flex-direction: column; }
    .ig-detail-col {
      flex: 1 1 auto;
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--ig-border);
      padding-left: 0;
      padding-top: 16px;
      margin-top: 8px;
    }
    .ig-detail { position: static; }
  }

  .feed-foot {
    text-align: center;
    padding: 16px 0 22px;
    border-top: 1px solid var(--ig-border-light);
    margin: 0 20px;
  }
  .feed-foot a {
    display: inline-block;
    color: #fff;
    background: var(--ig-blue);
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 16px;
  }
  .feed-foot a:hover { background: var(--ig-blue-hover); }
</style>
</head>
<body>

<div class="feed-wrap">

  <div class="ig-header">
    <div class="ig-header-top">
      <img class="ig-avatar" src="{logo}" alt="pmsoc.usyd avatar">
      <div class="ig-header-info">
        <div class="ig-username-row">
          <a class="ig-username" href="{profile_url}" target="_blank" rel="noopener">{handle}</a>
          <a class="ig-btn ig-btn-follow" href="{profile_url}" target="_blank" rel="noopener">Follow</a>
          <a class="ig-btn ig-btn-message" href="{profile_url}" target="_blank" rel="noopener">Message</a>
        </div>
        <div class="ig-stats-row">
          <span><b>{posts_count}</b> posts</span>
          <span><b>{followers_count}</b> followers</span>
          <span><b>{following_count}</b> following</span>
        </div>
      </div>
    </div>
    <div class="ig-bio">
      <p class="ig-bio-name">{display_name}</p>
      <p class="ig-bio-text">{bio_html}</p>
      <a class="ig-bio-link" href="{link_url}" target="_blank" rel="noopener">{link_text}</a>
    </div>
  </div>

  <!-- ============================================================
       Left: a Posts/Reels/Tagged tab row (centered to this column
       only, not the whole page) above a 3-column grid snapshot of
       the profile (3 pinned posts + the 6 most recent), styled like
       the real grid — square tiles with a small pin/reel/carousel
       badge in the corner.
       Right: a detail panel, separated from the grid by a full-height
       divider, that shows whichever post was last clicked, bigger,
       with its full caption. Clicking a tile never navigates away
       (middle-click / cmd-click still opens the real post); clicking
       any action icon, the caption link, Follow or Message does.
       Re-run build/build_canvas_html_ig.py after editing
       build/ig_posts.json to regenerate both columns.
       ============================================================ -->
  <div class="ig-body">
    <div class="ig-grid-col">
      <div class="ig-tabs">
        <a class="ig-tab active" href="{profile_url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
          Posts
        </a>
        <a class="ig-tab" href="{reels_url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Reels
        </a>
        <a class="ig-tab" href="{tagged_url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Tagged
        </a>
      </div>
      <div class="ig-grid">
{{GRID}}
      </div>
    </div>
    <div class="ig-detail-col">
      <div class="ig-detail">
        <div class="ig-detail-header">
          <img class="ig-detail-avatar" src="{logo}" alt="PMSoc logo">
          <span class="ig-detail-handle">pmsoc.usyd</span>
        </div>
        <div class="ig-detail-photo-wrap">
          <img src="" alt="">
          <video controls playsinline preload="none" style="display:none"></video>
        </div>
        <div class="ig-detail-actions">
          <a class="action" href="{profile_url}" target="_blank" rel="noopener" aria-label="Like">{heart}</a>
          <a class="action" href="{profile_url}" target="_blank" rel="noopener" aria-label="Comment">{comment}</a>
          <a class="action" href="{profile_url}" target="_blank" rel="noopener" aria-label="Send">{send}</a>
          <span class="spacer"></span>
          <a class="action" href="{profile_url}" target="_blank" rel="noopener" aria-label="Save">{bookmark}</a>
        </div>
        <div class="ig-detail-date"><span class="date-text"></span></div>
        <div class="ig-detail-caption-wrap">
          <p class="ig-detail-caption"><span class="handle-inline">pmsoc.usyd</span><span class="cap-text"></span></p>
        </div>
        <a class="ig-detail-link" href="{profile_url}" target="_blank" rel="noopener">View post on Instagram &#8599;</a>
      </div>
    </div>
  </div>

  <div class="feed-foot">
    <a href="{profile_url}" target="_blank" rel="noopener">See more on Instagram</a>
  </div>
</div>

<script>
  (function () {
    function timeAgo(iso) {
      var then = new Date(iso + 'T00:00:00Z');
      var days = Math.floor((Date.now() - then.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 30) return days + ' days ago';
      if (days < 365) {
        var m = Math.max(1, Math.round(days / 30.44));
        return m + (m === 1 ? ' month ago' : ' months ago');
      }
      var y = Math.max(1, Math.round(days / 365.25));
      return y + (y === 1 ? ' year ago' : ' years ago');
    }

    var detailImg = document.querySelector('.ig-detail-photo-wrap img');
    var detailVideo = document.querySelector('.ig-detail-photo-wrap video');
    var detailDate = document.querySelector('.ig-detail-date .date-text');
    var detailCapText = document.querySelector('.ig-detail-caption .cap-text');
    var detailLink = document.querySelector('.ig-detail-link');
    var detailActionEls = document.querySelectorAll('.ig-detail-actions .action');

    function selectTile(tile) {
      document.querySelectorAll('.ig-grid-item').forEach(function (el) {
        el.classList.remove('active');
      });
      tile.classList.add('active');

      var img = tile.querySelector('img');
      detailImg.src = img.src;
      detailImg.alt = img.alt;

      var videoSrc = tile.getAttribute('data-video-src');
      if (videoSrc) {
        detailVideo.src = videoSrc;
        detailVideo.setAttribute('poster', img.src);
        detailVideo.style.display = '';
        detailImg.style.display = 'none';
      } else {
        detailVideo.pause();
        detailVideo.removeAttribute('src');
        detailVideo.load();
        detailVideo.style.display = 'none';
        detailImg.style.display = '';
      }

      var url = tile.getAttribute('data-url');
      var kind = tile.getAttribute('data-kind');
      var dateIso = tile.getAttribute('data-date-iso');
      var tpl = tile.querySelector('template');
      var captionText = tpl ? tpl.content.textContent : '';

      detailCapText.textContent = captionText;
      detailDate.setAttribute('data-iso', dateIso);
      detailDate.textContent = timeAgo(dateIso);
      detailLink.textContent = 'View ' + kind + ' on Instagram ↗';
      detailLink.href = url;
      detailActionEls.forEach(function (a) { a.href = url; });
    }

    document.querySelectorAll('.ig-grid-item').forEach(function (tile) {
      tile.addEventListener('click', function (e) {
        e.preventDefault();
        selectTile(tile);
      });
    });

    var firstTile = document.querySelector('.ig-grid-item');
    if (firstTile) selectTile(firstTile);
  })();
</script>
</body>
</html>
